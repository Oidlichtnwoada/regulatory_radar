taxonomy:
  - id: nace
    name: NACE, Statistical classification of economic activities (Eurostat)
    url: https://ec.europa.eu/eurostat/web/nace
    note: NACE Rev. 2.1 is used in EU statistics from 2025; Rev. 2 is still common in older data. Your call; document it.
    checked: 200
