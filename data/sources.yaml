# Public sources for a regulatory radar. All public, no paid services.
# "checked" = HTTP status of the landing URL from a plain request on 2026-11-18
# (not a test of the API itself). 403 usually means a bot/WAF filter, 000 = no
# answer within 15 s from our network. Verify access, terms and rate limits
# yourself and list what you use in THIRD_PARTY.md.
#
# The two top-level keys give the level: eu | national
# stage:   what the channel tells you about a procedure's life cycle
# access:  api | sparql | rss | html | portal | standard (given where we checked it; not every entry has one)

eu:
  - id: eu_eurlex_cellar
    name: EUR-Lex via the Publications Office SPARQL endpoint (CELLAR)
    url: https://publications.europa.eu/webapi/rdf/sparql
    portal: https://eur-lex.europa.eu/
    access: sparql
    stage: proposals (CELEX sector 5), adopted acts incl. delegated/implementing acts (sector 3)
    languages: all EU official languages
    checked: 200
  - id: eu_parliament_open_data
    name: European Parliament Open Data Portal (API v2)
    url: https://data.europarl.europa.eu/en/developer-corner/opendata-api
    access: api
    stage: plenary agendas incl. foreseen votes, procedures, committee documents
    languages: all EU official languages
    checked: "200 (portal); API base did not answer within 15 s on our check"
  - id: eu_legislative_observatory
    name: Legislative Observatory (OEIL)
    url: https://oeil.secure.europarl.europa.eu/oeil/en
    access: html
    stage: procedure files with key events
    checked: 200
  - id: eu_have_your_say
    name: European Commission "Have your say" (Better Regulation portal)
    url: https://ec.europa.eu/info/law/better-regulation/have-your-say
    access: portal (the web app is backed by a JSON API you may discover)
    stage: calls for evidence, public consultations, draft delegated/implementing acts, all with feedback deadlines
    checked: 200
  - id: eu_council_press
    name: Council of the EU and European Council press releases
    url: https://www.consilium.europa.eu/en/press/press-releases/
    access: rss / html
    stage: general approaches, negotiating mandates, provisional agreements, conclusions
    checked: "403 (bot filter on plain requests)"
  - id: eu_tris
    name: TRIS, Technical Regulation Information System
    url: https://technical-regulation-information-system.ec.europa.eu/en/home
    access: portal
    stage: draft national technical rules notified by every member state, with standstill end date
    note: an EU portal that carries NATIONAL drafts; jurisdiction is the notifying country
    checked: "000 (no answer within 15 s on our check)"
  - id: eu_eprs_think_tank
    name: European Parliament Think Tank (EPRS briefings and studies)
    url: https://www.europarl.europa.eu/thinktank/en/home
    access: html / rss
    stage: background analysis, not regulation itself
    checked: "403 (bot filter on plain requests)"
  - id: eu_nlex
    name: N-Lex, gateway to national legislation databases
    url: https://n-lex.europa.eu/
    access: portal
    stage: entry point to all national gazettes
    checked: 200
  - id: eu_eli
    name: European Legislation Identifier (ELI)
    url: https://eur-lex.europa.eu/eli-register/about.html
    access: standard
    stage: common identifiers, implemented by several national gazettes
    checked: 202

