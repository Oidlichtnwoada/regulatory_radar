# Serves the Angular app and proxies the API, its docs and the MCP endpoint to the api service.
log_format radar '$remote_addr "$request" $status $body_bytes_sent $request_time';
server {
  listen 80;
  access_log /dev/stdout radar;
  error_log /dev/stderr warn;
  root /usr/share/nginx/html;
  location ~ ^/(api|mcp) {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
