# Serves the Angular app and proxies the API, its docs and the MCP endpoint to the api service.
log_format radar '$remote_addr "$request" $status $body_bytes_sent $request_time';
server {
  listen 80;
  access_log /dev/stdout radar;
  error_log /dev/stderr warn;
  root /usr/share/nginx/html;
  # Docker's DNS, re-resolved every 10 s: a recreated api container gets a new address, and a name fixed at
  # start-up would answer 502 until the web container restarts.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3000;
  location ~ ^/(api|mcp) {
    proxy_pass $api_upstream;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }
  location / {
    try_files $uri $uri/ /index.html;
  }
}
